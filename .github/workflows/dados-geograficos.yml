name: Atualizar dados geográficos (IBGE + OpenStreetMap)

# Executado sob demanda (Actions → este workflow → Run workflow).
# Baixa limites do IBGE e ruas/bairros do OpenStreetMap, processa com scripts/geo/build.mjs
# e grava o resultado em public/geo/ (docs/pacote-a/A4-busca-limites.md).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-geograficos
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar dados
        run: node scripts/geo/build.mjs
      - name: Resumo
        run: cat public/geo/fontes.json
      - name: Gravar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/geo
          if git diff --cached --quiet; then echo "Sem mudanças nos dados."; exit 0; fi
          git commit -m "chore(dados): atualizar dados geográficos (IBGE + OpenStreetMap)"
          git push

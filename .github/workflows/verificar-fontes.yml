name: Verificar fontes meteorológicas e links oficiais

# Executado sob demanda. Grava docs/fontes/verificacao.json (docs/pacote-a/A7-alertas-previsao.md).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fontes/verificar.mjs
      - name: Gravar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fontes
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(fontes): resultado da verificação de fontes meteorológicas"
          git push

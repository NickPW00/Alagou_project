name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - name: Galeria de prints da matriz de telas (revisão visual)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galeria-telas
          path: test-results/galeria
          if-no-files-found: ignore

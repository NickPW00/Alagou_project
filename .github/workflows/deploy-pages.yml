name: Publicar demonstração (GitHub Pages)

# Publica a versão de DEMONSTRAÇÃO (dados fictícios, com faixa de aviso) em
# https://nickpw00.github.io/Alagou_project/
on:
  push:
    branches: [claude/stoic-ramanujan-h530ag]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_DATA_MODE: demo
          VITE_BASE: /Alagou_project/
      # Permite abrir links diretos (ex.: /mapa) num site estático.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
